server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/doran}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:doran}
    password: ${DB_PASSWORD:doran}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
